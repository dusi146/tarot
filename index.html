<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Chatbot OpenRouter</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; background: #f4f4f9; }
  .config { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
  #chatbox { height: 400px; background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow-y: auto; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .msg { margin-bottom: 15px; padding: 10px 15px; border-radius: 15px; line-height: 1.4; max-width: 80%; word-wrap: break-word; }
  .user { background: #007bff; color: #fff; margin-left: auto; border-bottom-right-radius: 2px; }
  .bot { background: #e9ecef; color: #333; margin-right: auto; border-bottom-left-radius: 2px; }
  .input-area { display: flex; gap: 10px; }
  .input-area input { margin-bottom: 0; flex: 1; }
  button { padding: 10px 20px; background: #28a745; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
  button:hover { background: #218838; }
  button:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>

  <div class="config">
    <input type="password" id="apiKey" placeholder="Nhập OpenRouter API Key (bắt đầu bằng sk-or-...)">
    <input type="text" id="modelId" placeholder="Nhập Model ID (VD: meta-llama/llama-3-8b-instruct:free)" value="meta-llama/llama-3-8b-instruct:free">
  </div>

  <div id="chatbox"></div>

  <div class="input-area">
    <input type="text" id="msgInput" placeholder="Nhập câu hỏi test..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Gửi</button>
  </div>

  <script>
    const chatbox = document.getElementById('chatbox');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    let chatHistory = [];

    msgInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
      const key = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('modelId').value.trim();
      const msg = msgInput.value.trim();
      
      if (!key || !model || !msg) {
        alert('Điền đủ API Key, Model ID và nội dung tin nhắn!');
        return;
      }

      // Hiện tin nhắn user
      msgInput.value = '';
      chatbox.innerHTML += `<div class="msg user">${msg}</div>`;
      chatbox.scrollTop = chatbox.scrollHeight;
      
      // Khóa nút gửi
      sendBtn.disabled = true;
      sendBtn.textContent = 'Đang gọi...';

      // Lưu lịch sử
      chatHistory.push({ role: "user", content: msg });

      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${key}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: model,
            messages: chatHistory
          })
        });

        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error?.message || `Lỗi HTTP: ${res.status}`);
        }

        const botReply = data.choices[0].message.content;
        
        // Hiện tin nhắn bot
        chatbox.innerHTML += `<div class="msg bot">${botReply}</div>`;
        chatHistory.push({ role: "assistant", content: botReply });

      } catch (error) {
        chatbox.innerHTML += `<div class="msg bot" style="background: #ffebee; color: #c62828;"><b>Lỗi:</b> ${error.message}</div>`;
        chatHistory.pop(); // Xóa tin nhắn lỗi khỏi lịch sử
      }

      // Mở khóa nút gửi
      sendBtn.disabled = false;
      sendBtn.textContent = 'Gửi';
      chatbox.scrollTop = chatbox.scrollHeight;
      msgInput.focus();
    }
  </script>
</body>
</html>
