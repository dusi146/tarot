name: Deploy Tarot Web to GitHub Pages

on:
  # Chạy khi có code mới push lên nhánh main (nếu nhánh của mày là master thì đổi lại chữ master)
  push:
    branches: ["main"]
  workflow_dispatch:

# Cấp quyền cho GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # BƯỚC QUAN TRỌNG NHẤT: Bơm Key từ Secrets vào file HTML
      - name: Inject Gemini API Key
        run: |
          sed -i "s/{{GEMINI_API_KEY_SECRET}}/${{ secrets.GEMINI_API_KEY }}/g" index.html
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Thư mục gốc chứa file index.html
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
