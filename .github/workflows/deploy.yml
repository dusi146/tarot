name: Deploy Tarot Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Prepare public asset version
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("fs");
            ["script.js", "index.html"].forEach(file => {
              if (fs.existsSync(file)) {
                let content = fs.readFileSync(file, "utf8");
                content = content.replace(/\?v=\d{8}-\d+/g, "?v=" + process.env.ASSET_VERSION);
                fs.writeFileSync(file, content, "utf8");
              }
            });
          '
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
